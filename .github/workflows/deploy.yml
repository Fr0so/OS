name: Deploy to Simply

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Upload site to Simply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy site via lftp
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF
          set ftp:ssl-allow true
          set ftp:ssl-force false
          set ftp:passive-mode true
          set ssl:verify-certificate false
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --only-newer --exclude-glob .git* --exclude-glob .htaccess ./site/ /public_html/
          bye
          EOF
